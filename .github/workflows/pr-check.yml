name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch naming
        run: |
          if [[ "${{ github.head_ref }}" != feature/* ]]; then
            echo "Branch '${{ github.head_ref }}' does not start with 'feature/'"
            exit 1
          fi
          echo "Branch name is valid"

  validate:
    needs: check-branch-name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build